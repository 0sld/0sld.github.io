<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact - Hussam Alharbi</title><script>document.documentElement.classList.add('js');</script><link rel="icon" href="favicon.png" type="image/png"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Montserrat',sans-serif;background-color:#1a1c1d;color:#f4f4f4;overflow-x:hidden}:root{--gold:#cda052;--dark-bg:#1a1c1d;--card-bg:#222426;--text-light:#cccccc}@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeInScale{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}.js .contact-wrapper{opacity:0;transform:scale(0.96)}.js .section-subtitle,.js .section-header h2,.js .section-header p,.js .small-line,.js .contact-form .form-group,.js .contact-form .submit-btn{opacity:0;transform:translateY(30px)}.js.animations-ready .contact-wrapper{animation:fadeInScale 0.7s ease-out both}.js.animations-ready .section-subtitle{animation:fadeInUp 0.8s ease-out 0.1s both}.js.animations-ready .section-header h2{animation:fadeInUp 0.8s ease-out 0.2s both}.js.animations-ready .section-header p{animation:fadeInUp 0.8s ease-out 0.3s both}.js.animations-ready .small-line{animation:fadeInUp 0.8s ease-out 0.4s both}.js.animations-ready .contact-form .form-row .form-group:nth-child(1){animation:fadeInUp 0.8s ease-out 0.5s both}.js.animations-ready .contact-form .form-row .form-group:nth-child(2){animation:fadeInUp 0.8s ease-out 0.6s both}.js.animations-ready .contact-form > .form-group:nth-of-type(1){animation:fadeInUp 0.8s ease-out 0.7s both}.js.animations-ready .contact-form > .form-group:nth-of-type(2){animation:fadeInUp 0.8s ease-out 0.8s both}.js.animations-ready .contact-form > .form-group:nth-of-type(3){animation:fadeInUp 0.8s ease-out 0.8s both}.js.animations-ready .submit-btn{animation:fadeInUp 0.8s ease-out 0.9s both}.top-nav{position:absolute;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px 50px;box-sizing:border-box;background-color:rgba(26,28,29,0);border-bottom:none;backdrop-filter:blur(0)}.brand-link{font-family:'Playfair Display',serif;font-size:24px;color:#f2eedf;text-decoration:none;letter-spacing:1px;white-space:nowrap}.nav-links{display:flex;gap:0;align-items:center}.nav-btn{display:inline-flex;align-items:center;justify-content:center;min-width:112px;box-sizing:border-box;text-decoration:none;color:var(--gold);border:1px solid var(--gold);border-radius:0;padding:10px 25px;font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:500;transition:background-color .3s ease,color .3s ease}.nav-links .nav-btn+.nav-btn{margin-left:-1px}.nav-links .nav-btn:first-child{border-radius:4px 0 0 4px}.nav-links .nav-btn:last-child{border-radius:0 4px 4px 0}.nav-btn:hover,.nav-btn.active{background-color:rgba(205,160,82,.1);color:#fff}.contact-section{min-height:100vh;padding:100px 10%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(135deg,#1a1c1d 0%,#222426 100%)}.contact-wrapper{max-width:900px;width:100%;background-color:rgba(34,36,38,0.8);padding:80px;border:1px solid rgba(205,160,82,0.2);border-radius:8px;backdrop-filter:blur(10px)}.section-header{margin-bottom:50px;text-align:center}.section-subtitle{font-size:12px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;font-weight:500;margin-bottom:15px}.section-header h2{font-family:'Playfair Display',serif;font-size:48px;font-weight:400;color:#f2eedf;margin-bottom:15px}.section-header p{color:var(--text-light);max-width:500px;line-height:1.6;font-weight:300;margin:0 auto 20px}.small-line{width:60px;height:1px;background-color:var(--gold);margin:0 auto}.contact-form{display:flex;flex-direction:column;gap:25px}.form-group{display:flex;flex-direction:column;gap:8px}.form-group label{font-family:'Playfair Display',serif;font-size:16px;color:#f2eedf;font-weight:400;letter-spacing:1px}.form-group input,.form-group textarea{padding:18px 20px;font-family:'Montserrat',sans-serif;font-size:16px;background-color:rgba(255,255,255,0.05);border:1px solid rgba(205,160,82,0.3);border-radius:4px;color:#f2eedf;transition:all 0.3s ease;resize:vertical}.form-group input::placeholder,.form-group textarea::placeholder{color:rgba(255,255,255,0.4)}.form-group input:focus,.form-group textarea:focus{outline:none;background-color:rgba(255,255,255,0.08);border-color:var(--gold);box-shadow:0 0 15px rgba(205,160,82,0.3)}.submit-btn{padding:18px 50px;background:none;border:1px solid var(--gold);color:var(--gold);font-family:'Montserrat',sans-serif;font-size:14px;letter-spacing:3px;text-transform:uppercase;font-weight:500;cursor:pointer;transition:all 0.3s ease;border-radius:4px;margin-top:15px}.submit-btn:hover{background-color:rgba(205,160,82,0.15);color:#fff;transform:translateX(3px)}.submit-btn:active{transform:translateX(1px)}.form-message{margin-top:15px;padding:14px 16px;border-radius:4px;font-size:14px;display:none;animation:slideIn 0.3s ease}.form-message.success{background-color:rgba(76,175,80,0.2);color:#4caf50;border:1px solid rgba(76,175,80,0.4);display:block}.form-message.error{background-color:rgba(244,67,54,0.2);color:#f44336;border:1px solid rgba(244,67,54,0.4);display:block}@keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}.loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-radius:50%;border-top-color:var(--gold);animation:spin 0.8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px}.contact-footer{margin-top:35px;font-size:12px;color:rgba(255,255,255,0.6);text-align:center;letter-spacing:.5px}.js .contact-footer{opacity:0;transform:translateY(30px)}.js.animations-ready .contact-footer{animation:fadeInUp 0.8s ease-out 1s both}@media (max-width:768px){.top-nav{padding:18px 5%;gap:14px}.brand-link{font-size:18px}.nav-btn{min-width:92px;padding:10px 14px;font-size:11px;letter-spacing:2px}.contact-section{padding:60px 5%}.contact-wrapper{padding:40px 30px}.section-header h2{font-size:36px}.form-row{grid-template-columns:1fr}.submit-btn{width:100%}}</style></head><body><nav class="top-nav"><a href="index.html" class="brand-link">Hussam-Alharbi</a><div class="nav-links"><a href="index.html" class="nav-btn">Home</a><a href="contact.html" class="nav-btn active">Contact</a></div></nav><section class="contact-section"><div class="contact-wrapper"><div class="section-header"><div class="section-subtitle">GET IN TOUCH</div><h2>Send Me a Message</h2><p>Have a question or want to work together? I'd love to hear from you. Fill out the form below and I'll get back to you as soon as possible.</p><div class="small-line"></div></div><form class="contact-form" id="contactForm"><div class="form-row"><div class="form-group"><label for="name">Your Name</label><input type="text" id="name" name="name" required placeholder="Enter your full name"></div><div class="form-group"><label for="email">Your Email</label><input type="email" id="email" name="email" required placeholder="Enter your email address"></div></div><div class="form-group"><label for="subject">Subject</label><input type="text" id="subject" name="subject" required placeholder="What is this about?"></div><div class="form-group"><label for="message">Message</label><textarea id="message" name="message" rows="9" required placeholder="Type your message here..."></textarea></div><button type="submit" class="submit-btn"><span id="btnText">Send Message</span></button><div class="form-message" id="formMessage"></div></form></div><div class="contact-footer">© 2026. All rights reserved.</div></section><script>function startPageAnimation(){requestAnimationFrame(function(){requestAnimationFrame(function(){document.documentElement.classList.add('animations-ready');});});}document.addEventListener('DOMContentLoaded',startPageAnimation);document.getElementById('contactForm').addEventListener('submit',function(e){e.preventDefault();const btn=document.querySelector('.submit-btn');const msg=document.getElementById('formMessage');const name=document.getElementById('name').value.trim();const email=document.getElementById('email').value.trim();const subject=document.getElementById('subject').value.trim();const message=document.getElementById('message').value.trim();if(!name||!email||!subject||!message){msg.textContent='Please fill in all fields';msg.className='form-message error';msg.style.display='block';return;}const emailRegex=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;if(!emailRegex.test(email)){msg.textContent='Please enter a valid email address';msg.className='form-message error';msg.style.display='block';return;}btn.disabled=true;btn.innerHTML='<span class="loading"></span>';msg.style.display='none';setTimeout(()=>{msg.textContent='Thank you! Your message has been sent successfully. I will get back to you soon!';msg.className='form-message success';msg.style.display='block';document.getElementById('contactForm').reset();btn.disabled=false;btn.innerHTML='<span id="btnText">Send Message</span>';},1000);});</script></body></html>
